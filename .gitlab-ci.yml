Ubuntu 14.04 vertice:
  stage: vertice
  before_script:
    - echo "$USER"
    - export GOPATH=/home/gitlab-runner/.go
    - export GOROOT=/home/gitlab-runner/software/go
    - export PATH="$PATH:$HOME/.rvm/bin:$GOROOT/bin:$GOPATH/bin"
    - echo "$GOPATH"
    - echo $GOROOT
    - echo $PATH
  script:
    - cd /home/gitlab-runner/builds/fc6c1713/0/megamsys/gitpackager/vertice
    - rake clean
    - echo "$USER"
    - rake trusty
    - sudo cp -R /home/gitlab-runner/builds/fc6c1713/0/megamsys/gitpackager/vertice/build/trusty/*.deb /home/gitlab-runner/deb
  only:
    - 1.5.0-rc1
  allow_failure: true

