stages:
  - trusty_nsq

Ubuntu 14.04 verticensqd:
  stage: trusty_nsq
  script:
    - echo "$USER"
    - cd /home/gitlab-runner/builds/fc6c1713/0/megamsys/gitpackager/verticensqd
    - rake clean
    - rake trusty
    - cd /home/megdc
    - ./ex.sh
    - sudo cp -R /home/gitlab-runner/builds/fc6c1713/0/megamsys/gitpackager/verticensqd/build/trusty/*.deb /home/megdc/deb
  allow_failure: true
  only:
    - 1.5.0-rc1
