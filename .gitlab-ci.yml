notify:slack-fail:
  stage: notification_fail
  before_script:
    - sudo apt-get update && sudo apt-get install -y git curl bash
  script:
    - ./support/notify_slack "#relengg" "Build on \`$CI_BUILD_REF_NAME\` success! Commit \`$(git log -1 --oneline)\` See <https://gitlab.com/megamsys/gitpackager/commit/"$CI_BUILD_REF"/builds>"
  #when: on_success
  only:
    - 1.5.0-rc1
