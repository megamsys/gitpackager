stages:
  - trusty_nsq
  - trusty_nilavu
  - trusty_cadvisor
  - trusty_gateway
  - trusty_vertice
  - trusty_gulp
  - trusty_vnc
  - trusty_common
  - trusty_notification_fail

Ubuntu 14.04 verticensqd:
  stage: trusty_nsq
  script:
    - echo "$USER"
    - cd /home/gitlab-runner/builds/fc6c1713/0/megamsys/gitpackager/verticensqd
    - rake clean
    - rake trusty
    - sudo cp -R /home/gitlab-runner/builds/fc6c1713/0/megamsys/gitpackager/verticensqd/build/trusty/*.deb /home/gitlab-runner/deb
  allow_failure: true
  only:
    - 1.5.0-rc1

