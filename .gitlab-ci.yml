Ubuntu 14.04 verticegulpd:
  stage: notification_fail
  before_script:
    - echo "$USER"
        #- cd /builds/megamsys/gitpackager/vertice
    - export GOPATH=/home/gitlab-runner/.go
    - export GOROOT=/home/gitlab-runner/software/go
    - export PATH="$PATH:$HOME/.rvm/bin:$GOROOT/bin:$GOPATH/bin"
    - echo "$GOPATH"
    - echo $GOROOT
    - echo $PATH
  script:
    - cd /home/gitlab-runner/builds/fc6c1713/0/megamsys/gitpackager/verticegulpd
        #- cd /builds/megamsys/gitpackager/vertice
    - rake clean
    - echo "$USER"
    - rake trusty
    - sudo cp -R /home/gitlab-runner/builds/fc6c1713/0/megamsys/gitpackager/verticegulpd  /build/trusty/*.deb /home/gitlab-runner/deb

Ubuntu 14.04 vertice:
