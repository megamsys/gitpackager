
branch_template: &branch_build
  stage: build
  script:
    #- echo $NIGHTLY
    - mkdir -p ~/.ssh
    - echo "$DEV_GITLAB_SSH_KEY" > ~/.ssh/id_rsa
    - ssh-keyscan -H get.megam.io > ~/.ssh/known_hosts
    - sudo chmod -R 0600 ~/.ssh/
  only:
    - 1.5.0-rc1

Ubuntu 14.04 vertice:
  stage: build
  script:
    - echo "$USER"
    - cd /home/gitlab-runner/builds/fc6c1713/0/megamsys/gitpackager/vertice
        #- cd /builds/megamsys/gitpackager/vertice
    - export GOPATH=/home/gitlab-runner/.go
    - export GOROOT=/home/gitlab-runner/software/go
    - export PATH="$PATH:$HOME/.rvm/bin:$GOROOT/bin:$GOPATH/bin"
    - echo "$GOPATH"
    - echo $GOROOT
    - echo $PATH
    - rake clean
    - export MEGAM_HOME=/home/megdc/deb
    - echo $MEGAM_HOME
    - echo "$USER"
    - rake trusty

Ubuntu 14.04 verticegateway:
  stage: build
  script:
    - echo "$USER"
    - cd /home/gitlab-runner/builds/fc6c1713/0/megamsys/gitpackager/verticegateway
        #- cd /builds/megamsys/gitpackager/vertice
    - rake clean
    - echo "$USER"
    - rake trusty
    
notify:slack-fail:
  #image: "alpine"
  stage: build
  script:
    - apt-get update && sudo apt-get install -y git curl bash
    - ./support/notify_slack "#relengg" "(╯°□°)╯︵┻━┻  Build on \`$CI_BUILD_REF_NAME\` success! Commit \`$(git log -1 --oneline)\` See <https://gitlab.com/megamsys/gitpackager/commit/"$CI_BUILD_REF"/builds>"
  #when: on_failure
